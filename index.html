<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kuma - Aprende Lengua de Señas Colombiana</title>
  <meta name="theme-color" content="#2fb87a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/assets/logokuma.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Biblioteca de íconos SVG (se usan con <use href="#i-nombre">) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H11v17H5.5A1.5 1.5 0 0 0 4 21.5zM13 3h5.5A1.5 1.5 0 0 1 20 4.5v17a1.500 1.500 0 0 0-1.500-1.500H13z" fill="currentColor"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="currentColor"/><path d="M3.500 21c0-4.700 3.800-7.500 8.500-7.500s8.500 2.800 8.500 7.500z" fill="currentColor"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.500 2.900 6 6.600.9-4.800 4.600 1.200 6.500L12 17.300l-5.900 3.200 1.200-6.500L2.500 9.400l6.600-.9z" fill="currentColor"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6.500 6 12a6 6 0 0 1-12 0c0-2.500 1.200-4 2.500-5.500.4 1.800 1.200 2.800 2 3C10 8 10.500 4.500 12 2z" fill="currentColor"/></symbol>
      <symbol id="i-medal" viewBox="0 0 24 24"><path d="M7 2h3.500l1.500 5 1.500-5H17l-3 8h-4z" fill="currentColor" opacity=".6"/><circle cx="12" cy="15.500" r="6" fill="currentColor"/><path d="m12 12.500 1 2 2.200.3-1.600 1.500.4 2.200-2-1.100-2 1.100.4-2.200-1.600-1.500 2.200-.3z" fill="#fff"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z" fill="currentColor"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.500v15a1 1 0 0 0 1.500.9l12-7.500a1 1 0 0 0 0-1.700l-12-7.500A1 1 0 0 0 7 4.500z" fill="currentColor"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 11V5.500a1.500 1.500 0 0 1 3 0V10h1V4a1.500 1.500 0 0 1 3 0v6h1V6a1.500 1.500 0 0 1 3 0v8c0 4.500-3 8-7 8-3 0-4.800-1.800-6.200-4.500L3 13.500a1.500 1.500 0 0 1 2.500-1.600L8 15z" fill="currentColor"/></symbol>
      <symbol id="i-abc" viewBox="0 0 24 24"><path d="M3 18 7.500 6h1L13 18h-2.200l-.9-2.500H6.100L5.200 18zm3.600-4.300h2.800L8 9.500zM15 8h3.500a2.500 2.500 0 0 1 1.600 4.400A2.800 2.800 0 0 1 18.500 18H15zm2 1.800v2h1.400a1 1 0 0 0 0-2zm0 3.700v2.700h1.600a1.350 1.350 0 0 0 0-2.700z" fill="currentColor"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="currentColor"/></symbol>
      <symbol id="i-people" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.500" fill="currentColor"/><circle cx="17" cy="9" r="2.800" fill="currentColor" opacity=".7"/><path d="M1.500 20c0-3.800 2.900-6 6.500-6s6.500 2.200 6.500 6zM15 14.300c3.700-.5 7.500 1.200 7.500 5.700H16c0-2.200-.4-4-1-5.700z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <div class="fondo" aria-hidden="true">
    <span class="nube n1"></span><span class="nube n2"></span><span class="colina c1"></span><span class="colina c2"></span>
  </div>

  <header class="barra-superior">
    <a class="marca-kuma" href="#/inicio" aria-label="Kuma, volver al inicio">
      <img src="assets/assets/logokuma.png" alt="Kuma, mascota de la aplicación">
      <span><strong>Kuma</strong><small>LSC · modo campus</small></span>
    </a>
    <div class="sello-uis"><span>Con identidad</span><img src="assets/assets/Universidad_Industrial_de_Santander_logo.svg.webp" alt="Universidad Industrial de Santander"></div>
  </header>

  <!-- Aquí app.js dibuja la pantalla activa -->
  <main id="vista" tabindex="-1"></main>

  <div id="aviso" class="aviso" role="status" aria-live="polite">
    <img src="assets/assets/kumasilueta.png" alt="" aria-hidden="true">
    <span class="aviso-contenido"><span class="aviso-mensaje"></span><small class="aviso-reaccion">¡Buen toque! Kuma sigue en tu equipo.</small></span>
    <span class="aviso-destello" aria-hidden="true">✦</span>
  </div>

  <nav class="menu" aria-label="Navegación principal">
    <a href="#/inicio"    data-ruta="inicio"><svg class="ico"><use href="#i-home"/></svg><span>Inicio</span></a>
    <a href="#/lecciones" data-ruta="lecciones"><svg class="ico"><use href="#i-book"/></svg><span>Lecciones</span></a>
    <a href="#/perfil"    data-ruta="perfil"><svg class="ico"><use href="#i-user"/></svg><span>Perfil</span></a>
  </nav>

  <footer class="pie-proyecto">
    <span class="pie-hoja pie-hoja-a" aria-hidden="true"></span>
    <span class="pie-flor" aria-hidden="true"></span>
    <div class="pie-uis-logo"><img src="assets/assets/Universidad_Industrial_de_Santander_logo.svg.webp" alt="Logo oficial de la Universidad Industrial de Santander"></div>
    <p class="pie-autor">Una aventura hecha por estudiantes de la <strong>Universidad Industrial de Santander</strong></p>
    <p class="pie-avengers">Kuma regresará en Avengers: Doomsday</p>
    <span class="pie-hoja pie-hoja-b" aria-hidden="true"></span>
    <span class="pie-hongo" aria-hidden="true"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
